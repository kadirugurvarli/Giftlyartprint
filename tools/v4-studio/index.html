<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Studio V4 (local test)</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--mut:#6b6b6b;--acc:#2b6c5f;--bad:#b3261e;--ok:#1b7f3b;--warn:#8a5a00;--line:#ddd}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#222220;--ink:#eee;--mut:#a5a5a0;--acc:#6bc4b0;--bad:#ff8a80;--ok:#7bd88f;--warn:#ffcc66;--line:#3a3a36}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}h1{font-size:17px;margin:0}header small{color:var(--mut)}
main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px;padding:12px}@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
label{display:block;margin:8px 0 3px;color:var(--mut);font-size:12px}select,input[type=file]{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.sizes button{padding:6px 2px;font-size:12px}
button{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}button.on{outline:2px solid var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}.sw{display:flex;gap:6px;flex-wrap:wrap}.sw button{display:flex;align-items:center;gap:6px}.dot{width:14px;height:14px;border-radius:50%;border:1px solid #0006}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}img.prev{width:100%;border-radius:8px;display:block;background:#0003}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}.mut{color:var(--mut)}ul{margin:4px 0;padding-left:18px}.chk li{list-style:none;margin-left:-18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.grid figure{margin:0}.grid img{width:100%;border-radius:6px;border:1px solid var(--line)}figcaption{font-size:12px;color:var(--mut)}
pre{white-space:pre-wrap;background:var(--bg);padding:8px;border-radius:6px;font-size:12px;overflow:auto}
</style></head><body>
<header><h1>Content Studio V4</h1><small>local test interface · nothing is uploaded or stored; exports go to a git-ignored folder on this machine</small></header>
<main>
<aside>
  <div class="card"><h2>1 Room</h2><select id="room"></select><div id="roomInfo" class="mut"></div></div>
  <div class="card"><h2>2 Artwork</h2><input type="file" id="art" accept="image/png,image/jpeg,image/webp"><div id="artInfo" class="mut"></div></div>
  <div class="card"><h2>3 Frame</h2><label>Style</label><div class="sw" id="styles"></div><label>Mount</label><select id="mount"></select></div>
  <div class="card"><h2>4 Outer size (frame included)</h2><div class="sizes" id="sizes"></div><div class="mut" id="sizeInfo"></div></div>
  <div class="card"><h2>5 Engine</h2><select id="mode"></select><div class="row"><button class="pri" id="go" disabled>Preview</button><button id="regen" disabled>Regenerate</button></div><div id="status" class="mut"></div></div>
</aside>
<section>
  <div class="card"><h2>Preview</h2><div id="warn"></div><img id="prev" class="prev" alt="" hidden><div class="row"><button id="tgl" hidden>Show V3 baseline</button></div><ul class="chk" id="checks"></ul></div>
  <div class="card"><h2>6 Social export &amp; hand-off</h2>
    <div class="row" id="fmts"></div>
    <label>Content Tracker category</label><select id="cat"><option>Bespoke Framing</option><option>Fine Art Printing</option><option>Photo Gifts</option><option>Iris Photography</option><option>Business Printing</option></select>
    <div class="row"><button class="pri" id="exp" disabled>Export Facebook &amp; Instagram pack</button><button id="drive" disabled hidden>Send to Google Drive</button></div>
    <div id="expOut"></div></div>
</section></main>
<script>
const $=id=>document.getElementById(id);const S={opts:null,art:null,size:null,style:"walnut",variant:0,renderId:null,showBase:false,res:null,exportId:null};
const j=async(u,o)=>{const r=await fetch(u,o);return r.json()};
async function init(){S.opts=await j("/api/options");
 $("room").innerHTML=S.opts.rooms.map(r=>`<option value="${r.id}">${r.label}</option>`).join("");
 $("mount").innerHTML=S.opts.mounts.map(m=>`<option value="${m.id}" ${m.id==="classic"?"selected":""}>${m.label}</option>`).join("");
 $("styles").innerHTML=S.opts.styles.map(s=>`<button data-s="${s.id}" class="${s.id===S.style?"on":""}"><span class="dot" style="background:rgb(${s.colour})"></span>${s.label}</button>`).join("");
 $("sizes").innerHTML=S.opts.sizes.map(s=>`<button data-w="${s.width}" data-h="${s.height}" title="${s.orientation}">${s.width}×${s.height}</button>`).join("");
 $("mode").innerHTML=S.opts.modes.map(m=>`<option value="${m.id}" ${m.enabled?"":"disabled"}>${m.label}${m.enabled?"":" — not enabled"}</option>`).join("");
 $("fmts").innerHTML=S.opts.formats.map(f=>`<label style="display:flex;gap:6px;margin:0"><input type="checkbox" class="fm" value="${f.key}" checked>${f.label}</label>`).join("");
 if(S.opts.driveEnabled){$("drive").hidden=false}
 roomInfo();bind()}
function roomInfo(){const r=S.opts.rooms.find(x=>x.id===$("room").value);$("roomInfo").innerHTML=r?`${r.width}×${r.height}px · ${r.provenance}${r.provenance==="synthetic-test"?' <b class="warn">— synthetic room: engine demo only, not a visual approval</b>':""}${r.paidEligible?"":" · not eligible for paid edits"}`:""}
function bind(){$("room").onchange=roomInfo;
 $("styles").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.style=b.dataset.s;[...$("styles").children].forEach(c=>c.classList.toggle("on",c===b));fit()};
 $("mount").onchange=fit;
 $("sizes").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;S.size=[+b.dataset.w,+b.dataset.h];[...$("sizes").children].forEach(c=>c.classList.toggle("on",c===b));S.variant=0;upd()};
 $("art").onchange=async e=>{const f=e.target.files[0];if(!f){S.art=null;upd();return}S.art=await f.arrayBuffer();await fit()};
 $("go").onclick=()=>render(0);$("regen").onclick=()=>render(1);$("tgl").onclick=()=>{S.showBase=!S.showBase;show()};$("exp").onclick=doExport;$("drive").onclick=push}
async function fit(){if(!S.art){upd();return}const r=await j(`/api/fit?style=${S.style}&mount=${$("mount").value}`,{method:"POST",body:S.art});
 if(!r.ok){$("artInfo").innerHTML=`<span class="bad">${r.error}</span>`;S.art=null;upd();return}
 $("artInfo").textContent=`${r.width}×${r.height}px (aspect ${(r.width/r.height).toFixed(2)})`;
 [...$("sizes").children].forEach(b=>{const s=r.sizes.find(x=>x.width==b.dataset.w&&x.height==b.dataset.h);b.disabled=!s.fits;b.title=s.fits?`${s.orientation}, print fills ${Math.round(s.printFill*100)}% of the window`:`not suitable: ${s.reason}`});
 if(S.size&&[...$("sizes").children].find(b=>b.dataset.w==S.size[0]&&b.dataset.h==S.size[1]).disabled){S.size=null;[...$("sizes").children].forEach(c=>c.classList.remove("on"))}
 const suggest=r.sizes.filter(s=>s.fits&&s.orientation===(r.width>=r.height?"landscape":"portrait"));$("sizeInfo").textContent=suggest.length?`Matching orientation: ${suggest.map(s=>s.width+"×"+s.height).join(", ")}`:"";upd()}
function upd(){$("go").disabled=!(S.art&&S.size);$("regen").disabled=!S.renderId}
async function render(step){if(!S.art||!S.size)return;S.variant+=step;$("go").disabled=$("regen").disabled=true;$("status").textContent="Rendering…";
 const q=new URLSearchParams({room:$("room").value,size:S.size.join("x"),style:S.style,mount:$("mount").value,mode:$("mode").value,variant:S.variant});
 const r=await j("/api/render?"+q,{method:"POST",body:S.art});S.res=r;
 if(!r.ok){$("status").innerHTML=`<span class="bad">${r.error}${r.detail?": "+r.detail:""}</span>`;upd();return}
 S.renderId=r.renderId;S.showBase=false;$("status").textContent=`Done (${r.mode}, ${r.verdict}).`;show();upd();$("exp").disabled=false}
function show(){const r=S.res;if(!r||!r.ok)return;const p=$("prev");p.hidden=false;p.src="data:image/jpeg;base64,"+(S.showBase&&r.baselinePreview?r.baselinePreview:r.preview);
 $("tgl").hidden=!r.baselinePreview;$("tgl").textContent=S.showBase?"Show result":"Show V3 baseline";
 $("warn").innerHTML=(r.warnings||[]).map(w=>`<div class="warn">⚠ ${w}</div>`).join("")+`<div class="mut">${r.scaleDisclosure||""}</div>`;
 $("checks").innerHTML=[...r.checks,...(r.hybridChecks||[])].map(c=>`<li class="${c.pass?"ok":"bad"}">${c.pass?"✓":"✗"} ${c.name} <span class="mut">${c.detail}</span></li>`).join("")}
async function doExport(){if(!S.renderId)return;$("expOut").textContent="Exporting…";
 const formats=[...document.querySelectorAll(".fm:checked")].map(x=>x.value);
 const r=await j("/api/export",{method:"POST",body:JSON.stringify({renderId:S.renderId,formats,category:$("cat").value,captionVariant:S.variant})});
 if(!r.ok){$("expOut").innerHTML=`<span class="bad">${r.error}</span>`;return}
 S.exportId=r.exportId;$("drive").disabled=false;
 $("expOut").innerHTML=`<p class="ok">Saved to ${r.folder}</p><div class="grid">${r.files.map(f=>`<figure><img src="data:image/jpeg;base64,${f.thumb}"><figcaption>${f.fileName}<br>${f.width}×${f.height}, ${(f.bytes/1024).toFixed(0)} KB, q${f.quality}${f.upscale>1.25?` <span class="warn">upscaled ×${f.upscale}</span>`:""}</figcaption></figure>`).join("")}</div>
 ${r.errors.length?`<p class="bad">Not exported: ${r.errors.map(e=>e.format+" ("+e.error+")").join(", ")}</p>`:""}
 <h2>Instagram caption</h2><pre>${esc(r.captions.Instagram.text)}</pre><h2>Facebook caption</h2><pre>${esc(r.captions.Facebook.text)}</pre><div class="mut">Alt text: ${esc(r.captions.Instagram.altText)}</div>
 ${r.captionProblems.length?`<p class="bad">Caption issues: ${r.captionProblems.join(", ")}</p>`:""}
 <h2>Content Tracker row</h2><pre>${esc(JSON.stringify(r.tracker,null,2))}</pre><h2>Drive upload plan</h2><pre>${esc(JSON.stringify(r.drivePlan,null,2))}</pre>`}
async function push(){if(!S.exportId||!confirm("Send these files to the Google Drive feed?"))return;const r=await j("/api/drive-push",{method:"POST",body:JSON.stringify({exportId:S.exportId,confirm:true})});$("expOut").insertAdjacentHTML("afterbegin",`<p class="${r.ok?"ok":"bad"}">Drive: ${r.ok?"uploaded":JSON.stringify(r)}</p>`)}
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
init();
</script></body></html>
